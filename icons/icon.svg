<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0e2b"/>
      <stop offset="50%" stop-color="#1a1040"/>
      <stop offset="100%" stop-color="#0d2137"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="hand" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#ring)" stroke-width="6" opacity="0.3"/>

  <!-- Minute ticks -->
  <g stroke="rgba(255,255,255,0.15)" stroke-width="3">
    <line x1="256" y1="66" x2="256" y2="86"/>
    <line x1="256" y1="426" x2="256" y2="446"/>
    <line x1="66" y1="256" x2="86" y2="256"/>
    <line x1="426" y1="256" x2="446" y2="256"/>
  </g>

  <!-- Hour ticks -->
  <g stroke="rgba(79,195,247,0.25)" stroke-width="5" stroke-linecap="round">
    <line x1="256" y1="56" x2="256" y2="86"/>
    <line x1="256" y1="426" x2="256" y2="456"/>
    <line x1="56" y1="256" x2="86" y2="256"/>
    <line x1="426" y1="256" x2="456" y2="256"/>
  </g>

  <!-- Clock face inner circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Hour hand (pointing to ~10) -->
  <line x1="256" y1="256" x2="216" y2="160" stroke="url(#hand)" stroke-width="10" stroke-linecap="round"/>

  <!-- Minute hand (pointing to ~2) -->
  <line x1="256" y1="256" x2="340" y2="196" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.9"/>

  <!-- Second hand -->
  <line x1="256" y1="296" x2="290" y2="110" stroke="#ff6b35" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="256" cy="256" r="10" fill="#4fc3f7"/>
  <circle cx="256" cy="256" r="4" fill="#ffffff"/>

  <!-- Weather accent - small sun/cloud at bottom -->
  <circle cx="200" cy="390" r="18" fill="#ffd54f" opacity="0.8"/>
  <circle cx="220" cy="385" r="12" fill="#ffd54f" opacity="0.6"/>
  <path d="M 280 395 Q 290 375 310 385 Q 325 375 330 395 Z" fill="#90caf9" opacity="0.7"/>
  <circle cx="310" cy="385" r="14" fill="#90caf9" opacity="0.5"/>

  <!-- Small star dots -->
  <circle cx="100" cy="100" r="2.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="400" cy="90" r="2" fill="#ffffff" opacity="0.3"/>
  <circle cx="420" cy="400" r="2.5" fill="#ffffff" opacity="0.35"/>
  <circle cx="80" cy="370" r="2" fill="#ffffff" opacity="0.25"/>
</svg>
