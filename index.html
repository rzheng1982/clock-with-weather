<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>桌面时钟 · 天气</title>
    <meta name="description" content="精美的桌面时钟与实时天气信息，未来一周天气预报">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0e27">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="stars"></div>
    <div class="container">
        <header class="header">
            <div class="location-info">
                <svg class="location-pin" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4fc3f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                    <circle cx="12" cy="10" r="3"/>
                </svg>
                <span class="location-text" id="locationText">正在获取位置...</span>
                <button class="refresh-btn" id="refreshBtn" title="刷新天气数据">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 4 23 10 17 10"/>
                        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                    </svg>
                </button>
            </div>
            <div class="date-display" id="dateDisplay"></div>
        </header>

        <main>
            <section class="clock-section">
                <div class="clock-glow"></div>
                <div class="time-display">
                    <span class="time-digits" id="hours">00</span>
                    <span class="time-sep" id="sep1">:</span>
                    <span class="time-digits" id="minutes">00</span>
                    <span class="time-sep dimmed" id="sep2">:</span>
                    <span class="time-seconds" id="seconds">00</span>
                </div>
            </section>

            <section class="weather-section">
                <div class="weather-grid">
                    <div class="weather-card" id="cardTemp" style="--accent:#ff6b35;--accent2:#ffab91">
                        <div class="card-bg-icon">🌡️</div>
                        <div class="card-content">
                            <div class="card-label">温度</div>
                            <div class="card-value" id="tempValue">--°C</div>
                            <div class="card-sub" id="feelsLike">体感 --°C</div>
                        </div>
                    </div>
                    <div class="weather-card" id="cardCondition" style="--accent:#4fc3f7;--accent2:#81d4fa">
                        <div class="card-bg-icon" id="conditionIcon">☀️</div>
                        <div class="card-content">
                            <div class="card-label">天气状况</div>
                            <div class="card-value" id="conditionText">--</div>
                            <div class="card-sub" id="humidityText">湿度: --%</div>
                        </div>
                    </div>
                    <div class="weather-card" id="cardUV" style="--accent:#b388ff;--accent2:#d1c4e9">
                        <div class="card-bg-icon">☀️</div>
                        <div class="card-content">
                            <div class="card-label">UV 指数</div>
                            <div class="card-value" id="uvValue">--</div>
                            <div class="card-sub" id="uvLevel">--</div>
                        </div>
                    </div>
                    <div class="weather-card" id="cardAQI" style="--accent:#66bb6a;--accent2:#a5d6a7">
                        <div class="card-bg-icon">🌬️</div>
                        <div class="card-content">
                            <div class="card-label">空气质量</div>
                            <div class="card-value" id="aqiValue">--</div>
                            <div class="card-sub" id="aqiLevel">--</div>
                        </div>
                    </div>
                </div>

                <section class="forecast-section">
                    <div class="forecast-header">
                        <span>未来 7 天预报</span>
                        <span class="forecast-header-line"></span>
                    </div>
                    <div class="forecast-scroll" id="forecastContainer">
                        <!-- 7-day forecast cards injected by JS -->
                    </div>
                </section>
            </section>
        </main>

        <footer class="footer">
            <span id="updateTime">加载天气数据中...</span>
            <span class="footer-dot">·</span>
            <span>自动刷新每10分钟</span>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
